<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Gerenciamento de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>💻 TechStore - Painel de Controle</h1>
        <div id="usuario-info" class="hidden">
            <span id="nome-usuario"></span>
            <button id="btn-logout" class="btn-secondary">Sair</button>
        </div>
    </header>

    <main class="container">
        <!-- Tela de Login -->
        <section id="secao-login" class="card">
            <h2>Acesso ao Sistema</h2>
            <p class="dica">Dica de teste:<br>Admin: <b>admin@techstore.com</b> / <b>123</b><br>User: <b>user@techstore.com</b> / <b>123</b></p>
            
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">E-mail:</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="login-senha">Senha:</label>
                    <input type="password" id="login-senha" required placeholder="******">
                </div>

                <button type="submit">Entrar</button>
            </form>
        </section>

        <!-- Painel Principal (Produtos + Cadastro) -->
        <div id="secao-painel" class="hidden">
            <!-- Form de Cadastro só aparece para Admin -->
            <section id="secao-cadastro" class="card hidden">
                <h2>Cadastrar Novo Produto</h2>
                <form id="form-produto">
                    <div class="form-group">
                        <label for="nome">Nome do Produto:</label>
                        <input type="text" id="nome" required placeholder="Ex: Teclado Mecânico">
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoria:</label>
                        <select id="categoria" required>
                            <option value="">Selecione...</option>
                            <option value="Hardware">Hardware</option>
                            <option value="Periféricos">Periféricos</option>
                            <option value="Notebooks">Notebooks</option>
                            <option value="Monitores">Monitores</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="preco">Preço (R$):</label>
                            <input type="number" id="preco" step="0.01" min="0" required placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label for="quantidade">Estoque:</label>
                            <input type="number" id="quantidade" min="0" required placeholder="0">
                        </div>
                    </div>

                    <button type="submit" id="btn-salvar">Cadastrar Produto</button>
                </form>
            </section>

            <!-- Listagem de Produtos -->
            <section class="card">
                <h2>Produtos Cadastrados</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Categoria</th>
                                <th>Preço</th>
                                <th>Qtd. Estoque</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-produtos">
                            <!-- Inserido dinamicamente -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
